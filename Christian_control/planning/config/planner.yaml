# Planner tuning — the knobs you sweep, in one place.
#
# Every key here is required on every run. A missing key, an unknown key, or
# a value outside its stated range is a hard error naming the key; nothing
# ever falls back to a silent default. That is the point of the file: the
# failure a config file most invites is "I changed it and nothing happened",
# and refusing typos is the only thing that actually prevents it.
#
# Read from this path by default (config/ beside the executable's parent),
# or from --planner-config PATH. Never discovered from the working
# directory. The effective values and this file's digest are echoed to the
# bridge's diagnostics on every run, so a session log says exactly what
# tuning produced its trajectory.
#
# NOT here, deliberately:
#   joint limits         -> config/joint_limits.yaml (beside this file).
#                           Kinova table values; they already have a file.
#   SDF grid extent      -> WorldSdf.h. Not a preference: the grid must
#                           contain the arm's reachable envelope, because
#                           gpmp2 reports "no obstacle" outside it, silently.
#                           test_grid_coverage enforces that and would not
#                           see a change made here.
#   arm sphere radius    -> GenerateArmModel.cpp. Sets the same envelope
#                           test_grid_coverage checks, so it cannot move
#                           without that test moving with it.
#   speed clip, splice guard, following-error stop
#                        -> control/Config.h, compiled. Safety
#                           policy is not runtime-settable
#                           (docs/decisions/compiled-config.md). Naming one
#                           of those keys here is an error, not an override.

# How the plan is shaped in time.
motion:
  # Metres per second the plan is paced at: goal distance divided by this
  # gives the trajectory duration, which the controller then follows by
  # timestamp. This is the knob that makes the arm move slower or faster —
  # for POINT-TO-POINT goals only; a traced path's lap time is duration_s
  # in goal.yaml. The controller's own clip (76/66.5 deg/s, Config.h)
  # rejects a block that exceeds it at ingest, so raising this far enough
  # fails there, late.
  nominal_speed_mps: 0.25
  # Floor on that duration, seconds, so short moves are not abrupt. A
  # smoothness floor only — at its former 4.0 it silently paced every
  # reachable move (docs/motion-limits-map.md).
  min_duration_s: 1.0
  # Optimizer support states between start and goal. More is a finer plan
  # and a slower solve — the factor graph is rebuilt per waypoint.
  waypoints: 20

# What the planner treats as "too close".
obstacles:
  # Metres from an obstacle surface at which its cost switches on. With the
  # arm's 0.05 m collision spheres the effective clearance is about double.
  minimum_clearance_m: 0.005
  preferred_clearance_m: 0.10
  # Obstacle-avoidance weight. A gtsam sigma: SMALLER avoids harder.
  collision_sigma: 0.0005
  # The one persistent mount-frame obstacle scene. Keep empty until a
  # measured, Christian-confirmed geometry is supplied.
  scene:
    torso:
      enabled: true
      shape: cylinder
      center_mount_m: [0.15, 0.0, 0.0]
      permitted_sphere_groups: ["mount_interface", "proximal_arm", "upper_arm"]
      radius_m: 0.24
      height_m: 1.4

# How far the plan may stray from constant velocity.
smoothness:
  # Scales the GP prior covariance Qc. Larger is freer to wander off a
  # straight line (better at dodging, wigglier); smaller is straighter and
  # stiffer.
  qc_scale: 1.0

# Redundancy resolution: among configurations that achieve the task, prefer
# the one that keeps bounded joints away from their stops. Preferences, not
# constraints — the hard limit stays with validation and the controller.
posture:
  # Weak prior toward each bounded joint's mid-range at every support
  # state; sigma = half-range x this value (unitless, LARGER is gentler).
  # Continuous joints 1/3/5/7 are automatically unaffected.
  centering_sigma: 2.0
  # Degrees from a bounded joint's planner limit at which the optimiser's
  # hinge cost switches on. Matches the controller's 20 deg limit-avoidance
  # zone so the planner prices the region the controller will fight over
  # (2026-08-23: a terminal planned 0.4 deg from joint 2's stop stalled the
  # arm on its software boundary 27 mm short of the goal).
  limit_threshold_deg: 20.0

solver:
  # Levenberg-Marquardt iteration ceiling. Shapes convergence, not motion.
  max_iterations: 1000
  # Bjorn-parity acceptance gate (2026-08-24, docs/intent/story.md
  # "Multi-gate plan validation"): a candidate is accepted when its raw
  # GTSAM graph error (the optimizer's final total weighted-squared-
  # residual, TrajectoryResult::final_error) is below this single number.
  # Scene clearance, self-collision, joint-limit and task-error checks are
  # still measured and reported but no longer gate acceptance on their
  # own.
  #
  # Calibrated 2026-08-24 against this file's own weights (planner_bridge,
  # --planner-config ../config/planner.yaml), via offline point-goal and
  # traced-circle solves:
  #   good point goal (left arm, 0.024 mm task residual, clean reach):
  #     final_error = 1.33
  #   good traced circle (left arm, 5.76 mm max dense fidelity):
  #     final_error = 4.24
  #   bad plans (right arm, direct route through the torso obstacle,
  #     production collision_sigma): final_error = 28028, 35124, 55298,
  #     70135, 72386
  # 100 sits >20x above the best good number and >280x below the smallest
  # bad number measured — comfortable headroom on both sides.
  acceptance_graph_error: 100.0
  # Bjorn-parity multi-restart cap (2026-08-24, docs/intent/story.md
  # "Branch/route/bypass terminal search"): how many fresh terminal
  # postures the retry loop inside duration repair may try, per duration
  # attempt, before falling through. Replaces the deterministic
  # 3-exact/19-shortened branch/bypass search: obstacle avoidance is the
  # optimizer's own SDF cost term's job now, and this restart budget is
  # what recovers Bjorn's local-minimum-escape behaviour instead.
  #
  # Calibrated 2026-08-24 against the known-bad corpus — see the
  # calibration note this same story.md entry cites.
  max_restart_attempts: 10

# Tracing a Cartesian path (a circle, a line). These path-following weights
# are ignored by point-to-point plans.
#
# TWO KINDS OF NUMBER LIVE HERE and must not be conflated. The *_sigma_*
# values are optimiser WEIGHTS (gtsam sigmas: smaller is stiffer). The
# maximum_*_error values are quality-report thresholds measured on the
# finished trajectory reconstruction. Tightening a weight does not tighten
# the reported threshold, and no weight guarantees it is met.
path_following:
  # Weights on each traced waypoint's pose prior.
  position_prior_sigma_m: 0.0012
  rotation_prior_sigma_rad: 0.01
  # Trace deviation is quality evidence reported with the plan, not a whole-
  # request rejection gate. 5 mm is the configured reporting threshold.
  maximum_planning_error_m: 0.005
  maximum_orientation_error_rad: 0.1
  # Dense validation rate. 0.002 s = 500 Hz, the controller's own loop rate,
  # so validation sees what the arm sees.
  validation_dt_s: 0.004
  # Approach phase. Paced from JOINT displacement over joint velocity
  # limits — it is task-space unconstrained and has no commanded Cartesian
  # route, so a Cartesian length would be timing a path that does not exist.
  approach_velocity_fraction: 0.7
  approach_min_duration_s: 0.1
  approach_waypoints: 5
  # Circle sampling by geometry rather than an arbitrary count:
  # e = r(1 - cos(pi/N)). Halving this roughly doubles the sample count.
  max_chord_error_m: 0.001

# IK run provenance. Path IK uses one continuation solve plus four deterministic
# null-space alternatives; it does not use large random-restart loops.
#
# These fields remain strict and reported so existing run records retain their
# seed provenance. They do not change point-goal IK behaviour.
seeding:
  # Retained for run provenance. Every planning report prints this value.
  ik_seed: 20260807
  # Retained for compatibility with existing run metadata.
  randomised: true
