# Model and dependency provenance for the dual-arm MuJoCo execution twin.
#
# Machine-readable record checked by tests/test_model_provenance.py
# (registered as ctest `sim_model_provenance`). The test recomputes every
# hash and cross-checks the mount transforms and TCP names against the
# URDF itself, so a stale or hand-mistyped entry here fails the build.
#
# Authority split (Plan 02):
# - Kinematic truth (frames, joint order, limits, mount transforms, TCPs):
#   the production URDF below, via DualArmKinematics.
# - Simulator mechanics (meshes, inertials, actuator classes): the
#   msc_project gen3.xml below. Its scene.xml mounting is NOT HumanSL
#   geometry and is never a source.
# Recorded 2026-08-17.

units:
  length: metres
  angle: radians
  time: seconds
  # Robot-interface degrees and Vicon millimetres are converted once at
  # their adapter boundaries (engineering contract section 2); every value
  # in this file and in the generated MJCF uses the units above.

