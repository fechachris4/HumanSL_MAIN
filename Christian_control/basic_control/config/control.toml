# Default runtime configuration for ./controller — loaded automatically
# because this file exists at the compiled default path (--config <path>
# overrides it; CLI flags override both; docs/decisions/runtime-config.md).
# Every run echoes the effective values and their sources.
#
# Unknown keys are hard errors. Safety policy (stop_on_fault, speed-clip
# derivation, connection parameters) is NOT configurable here.

controller = "reactive-pose"

# Hardware-proven gain scale (docs/decisions/reactive-pose-port.md) — NOT
# the simulation's Kp=32/s.
kp = 1.0      # Cartesian position P gain, 1/s (both laws)
kp_rot = 1.0  # rotation P gain, 1/s (reactive-pose)

# Retarget by editing a file (reactive-pose only): uncomment, then during a
# run edit+save that file with one line "x y z" or "x y z roll pitch yaw"
# (meters / radians, base frame). Content at startup is ignored — only
# in-session edits become targets. Relative paths resolve from the
# directory you run in (build/).
# target_file = "target.txt"

# Optional vertical cylinder around the human/occupied area. When enabled,
# direct end-effector paths that cross the inflated cylinder automatically
# take the shortest clockwise, counter-clockwise or over-the-top waypoint
# route. Targets inside are moved just outside; they are not refused.
# Coordinates are meters in the robot base frame. Set the centre/radius from
# your measured setup before changing enabled to true.
cylinder_keepout_enabled = false
cylinder_keepout_center_x_m = 0.0
cylinder_keepout_center_y_m = 0.0
cylinder_keepout_radius_m = 0.25
cylinder_keepout_z_min_m = 0.0
cylinder_keepout_z_max_m = 1.8
cylinder_keepout_clearance_m = 0.10
cylinder_waypoint_tolerance_m = 0.01

# Staged bring-up terms — enable one at a time, each gated on the previous
# stage's CSV (docs/decisions/reactive-pose-port.md):
# velocity_term_enabled = true   # Kd term (stage 6)
# kd_pos = 0.3
# kd_rot = 0.3
# null_space_enabled = true      # joint centering (stage 7 — run
# null_gain = 1.0                # ./query_limits first: J4/J6 soft limits)
