<!doctype html>
<meta charset="utf-8">
<title>scene.js — TCP marker eye check</title>
<link rel="stylesheet" href="panel.css">
<style>
  body { margin: 0; padding: 14px; }
  h1 { font-size: 13px; letter-spacing: 0.09em; text-transform: uppercase; }
  .holder { height: 560px; border: 1px solid var(--rule); background: var(--ground); }
  canvas { display: block; width: 100%; height: 100%; }
  .buttons { display: flex; gap: 6px; margin-top: 10px; }
</style>

<h1>scene.js — runtime TCP marker eye check</h1>
<p>No server and no robot. This page supplies mount-frame telemetry points,
not joints or a browser kinematic model.</p>
<div class="holder"><canvas id="scene"></canvas></div>
<div class="buttons">
  <button id="together">COINCIDENT</button>
  <button id="apart">SEPARATED</button>
  <button id="obstacle">TORSO</button>
  <button id="empty">EMPTY</button>
</div>

<script type="module">
import { createScene } from './scene.js';

const scene = createScene(document.getElementById('scene'));
scene.setSelectedArm('right');

function telemetry(measured, commanded) {
  return {
    measured_tcp_x_mount_m: measured[0],
    measured_tcp_y_mount_m: measured[1],
    measured_tcp_z_mount_m: measured[2],
    commanded_tcp_x_mount_m: commanded[0],
    commanded_tcp_y_mount_m: commanded[1],
    commanded_tcp_z_mount_m: commanded[2],
  };
}

document.getElementById('together').onclick = () =>
  scene.setTelemetry('right', telemetry([0.35, -0.4, 0.55], [0.35, -0.4, 0.55]));
document.getElementById('apart').onclick = () =>
  scene.setTelemetry('right', telemetry([0.35, -0.4, 0.55], [0.48, -0.28, 0.62]));
document.getElementById('obstacle').onclick = () =>
  scene.setObstacles([{ id: 'torso', enabled: true, shape: 'cylinder',
    center_mount_m: [0, 0, 0.35], radius_m: 0.2, height_m: 0.7 }]);
document.getElementById('empty').onclick = () => {
  scene.setTelemetry('right', null);
  scene.setObstacles([]);
};

document.getElementById('apart').click();
</script>
