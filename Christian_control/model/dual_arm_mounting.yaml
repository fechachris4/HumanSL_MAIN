# Dual-arm mounting geometry — the source of truth for where the two Gen3
# bases sit relative to the shared `mount` frame.
#
# GEN3_dual_mounted.urdf's two mounting joints MUST agree with this file.
# That agreement is enforced by tests/test_dual_arm_mounting.cpp (ctest name
# `dual_arm_mounting`), which loads the URDF through Pinocchio and compares
# the composed mount->base transforms against the values below. Edit this
# file first, then the URDF, then run the test — if they disagree the build's
# test step fails and names the offending number.
#
# PROVENANCE — READ BEFORE TRUSTING THESE NUMBERS.
# The separation below is an APPROXIMATE PHYSICAL MEASUREMENT of the rig
# (2026-08-19), not a precision calibration: treat it as good to a few
# millimetres and re-measure before any result that depends on inter-arm
# geometry. The tilt is still INHERITED, NOT MEASURED — it arrived fully
# formed in commit af116a5c ("basic_control: mounted dual-arm model,
# right-only actuation") with no measurement note. Replace it with a
# measured value when the rig is surveyed; nothing else in the codebase
# needs to change when you do.

# Distance between the two arms' base_link origins, metres, along mount +y.
# Measured on the rig, 2026-08-19. This supersedes the inherited 0.113415 m,
# which was DERIVED as 2 * 0.16 * sin(1.2085) from a round 0.16 m
# base-to-mount radius that was itself never measured. The measurement and
# that derivation do not agree, and the measurement wins: do not back out a
# new radius from it, and do not treat 0.16 m as still describing this rig.
base_separation_m: 0.075

# Roll of each base about mount X, radians. The right arm mounts at
# +mount_tilt_rad and the left at -mount_tilt_rad, so the pair is mirrored
# about the mount XZ plane and the relative rotation is Rx(-2 * tilt).
# 1.2085 rad = 69.2419 deg.
mount_tilt_rad: 1.2085

# Where the mount origin sits. `base_midpoint` puts it exactly halfway
# between the two base_link origins, so each base is at
# [0, -+base_separation_m/2, 0] with roll -+mount_tilt_rad.
#
# The previous model used a torso-apex origin instead: mount sat 0.149614 m
# ABOVE this midpoint, equidistant (0.16 m) from both bases. Chosen 2026-08-05
# in favour of the midpoint so that mount y and z read directly as "between
# the arms" and "at mount height" — see docs/decisions/custom-urdf.md.
#
# `base_midpoint` is the only value the URDF currently encodes; it is named
# here so that a future change of convention is a visible edit rather than a
# silent re-interpretation of the numbers above.
mount_origin: base_midpoint
